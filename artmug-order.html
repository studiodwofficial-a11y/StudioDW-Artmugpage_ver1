.services{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 16px}
.service{grid-column:span 6;grid-row:span 4;display:grid;grid-template-rows:subgrid;border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0;background:rgba(128,128,128,.035)}

.service:nth-child(2) .media{width:84%;justify-self:end;margin-top:9%}

/* //수정: Signature features two samples; Standard uses an even three-column grid.// */
.signature-samples {
  display:grid;
  grid-template-columns:minmax(0, 1.42fr) minmax(0, 1fr);
  gap:16px;
  align-items:start;
}
.signature-side { display:grid; gap:16px; min-width:0; }
.signature-samples .media { aspect-ratio:16/9; border-radius:12px; }
.sample-copy { min-width:0; }
.signature-side .sample-copy { padding-inline:4px; }
.sample-copy h3 {
  margin:0;
  color:var(--accent);
  font-size:clamp(24px, 2.5vw, 36px);
  line-height:1.3;
  letter-spacing:-.04em;
}
.sample-copy p { color:var(--muted); font-size:14px; line-height:1.65; margin:8px 0; }
.sample-copy strong { display:block; font-size:13px; font-weight:600; }
.standard-samples { margin-top:36px; padding-top:22px; border-top:1px solid var(--line); }
.standard-samples .sample-copy { margin-bottom:16px; }

/* //수정: A fixed company-name row aligns every cell, with or without a group.// */
.companies strong, .companies strong:nth-last-child(-n+3) { border-bottom:1px solid var(--line); }
.companies strong:last-child { border-bottom:0; }
.companies strong { display:grid; grid-template-rows:minmax(55px,auto) 24px; align-content:center; }
.companies .company-name { align-self:center; }
.companies small { margin:0; align-self:center; }

.facts article { border-left:0; padding:3px 0; }
.facts h3 { border-left:3px solid var(--accent); padding-left:16px; }
.facts p { padding-left:19px; }

  .step:hover { border-color:var(--line); }
}
@media(max-width:760px) {
  .signature-samples { grid-template-columns:minmax(0,1fr); }
  .signature-side .media { width:85%; justify-self:end; }
  .signature-side .sample-copy { padding-inline:0; }
  .companies strong:nth-last-child(-n+2) { border-bottom:0; }
}

/* //수정: The sticky bar occupies the same vertical space as the top of the Hero.// */
body { --header-height:94px; }
.hero-header {
  position:sticky;
  top:0;
  z-index:10;
  height:var(--header-height);
  margin-bottom:calc(-1 * var(--header-height));
  background:linear-gradient(to bottom, rgba(14,15,11,.96) 0%, rgba(14,15,11,.78) 43%, rgba(14,15,11,.33) 78%, transparent 100%);
  color:#fff;
}
.hero-header .container { display:grid; grid-template-columns:1fr auto 1fr; }
.hero-header .controls { justify-self:end; align-items:center; }
.header-settings { display:flex; align-items:center; gap:12px; }
.hero-header button { min-height:34px; }
.hero-header a:focus-visible, .hero-header button:focus-visible { outline-color:#d9f779; }
#primary-nav { padding:7px 20px; gap:28px; background:#0e0f0b55; }
#primary-nav a { padding:4px 0; white-space:nowrap; }
#primary-nav a:hover, #primary-nav a[aria-current] { color:var(--accent); }
#lang-switcher { display:flex; border:1px solid #90959c; border-radius:30px; padding:2px; gap:2px; }
#lang-switcher button { min-height:28px; padding:3px 7px; border:0; }
#lang-switcher button[aria-pressed="true"] { background:var(--accent); color:#0e0f0b; font-weight:700; }
#menu-toggle { display:none; }
#services, #portfolio, #contact { scroll-margin-top:var(--header-height); }
.hero > .container { padding-top:calc(var(--header-height) / 2); }
.hero-reel { position:absolute; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; }
.hero-reel[hidden] { display:block; opacity:0; }

.companies {
  grid-template-columns:repeat(3,minmax(0,1fr));
  align-items:start;
  gap:16px 36px;
  border:0;
  border-block:1px solid var(--line);
  border-radius:0;
  min-height:0;
  padding:22px 0;
  overflow:visible;
  text-align:left;
}
.history .companies strong {
  display:grid;
  grid-template-rows:auto auto;
  align-content:start;
  gap:2px;
  border:0;
  padding:0;
  min-height:0;
  font-size:14px;
  line-height:1.35;
  letter-spacing:0;
}
.companies .company-name { justify-content:start; min-height:0; overflow-wrap:anywhere; }
.companies small { font-size:11px; min-height:0; line-height:1.4; margin:0; }
.companies small:empty { display:none; }
html[lang="ja"] body { font-family:"Plus Jakarta Sans","Noto Sans JP","Noto Sans KR",sans-serif; }
@media(max-width:920px) {
  body {
    --header-height:60px;
    --mobile-header-surface:#0e0f0b;
    --floating-button-size:45px;

  }
  .hero-header { padding:0; }

  .hero-header .controls { position:fixed; inset-inline-end:var(--floating-button-inset); bottom:var(--mobile-menu-bottom); }

#services { padding-top:28px; }

.services-page { padding-top:calc(var(--header-height) + 42px); padding-bottom:55px; min-height:calc(100vh - 55px); }
.about-intro h1 { margin-top:9px; font-size:clamp(30px,4.4vw,62px); }

/* //수정: Form surfaces follow the original application form's field and panel treatment.// */
body { --dw-dark:#0e0f0b; --form-surface:#181a14; --form-field:#0e0f0b; --form-border:#35392c; --form-accent-border:#b2d24a70; }
body.light { --form-surface:#fff; --form-field:#f5f5ef; --form-border:#deded5; --form-accent-border:#849d45; }
.site-footer .about-social img { filter:grayscale(1); }
.inquiry-form,.quote-fields,.quote-summary {
  background:var(--form-surface); border:1px solid var(--form-border); border-radius:22px;
  padding:clamp(18px,3vw,36px);
}
.inquiry-form { gap:17px; }
.inquiry-form label { font-size:12px; font-weight:600; }
.inquiry-form input,.inquiry-form select,.inquiry-form textarea {
  border-radius:12px; border-color:var(--form-border); background:var(--form-field); padding:11px 13px;
  font-size:14px; font-weight:400; transition:border-color .2s ease, background-color .2s ease;
}
.inquiry-form input[type="date"] { min-width:0; color-scheme:dark; }
body.light .inquiry-form input[type="date"] { color-scheme:light; }
.inquiry-form input[type="date"]::-webkit-calendar-picker-indicator { cursor:pointer; opacity:.75; }
.inquiry-form input:focus,.inquiry-form select:focus,.inquiry-form textarea:focus { outline:0; border-color:var(--accent); }
.quote-fields { gap:18px; }
.quote-group { padding-top:16px; border-top:1px solid var(--form-border); }
.quote-group h3 { margin-bottom:10px; }
.quote-field {
  border-color:var(--form-border); border-radius:12px; background:var(--form-field);
  transition:border-color .2s ease;
}
.quote-field:focus-within { border-color:var(--accent); }
.quote-field input:not([type=checkbox]):focus,.quote-field select:focus { outline:none; }
.quote-summary { border-color:var(--form-accent-border); }
.quote-summary .eyebrow { color:var(--accent); }
.quote-summary .commerce-action,.quote-dialog .commerce-action,.inquiry-actions .commerce-action { border-radius:12px; }
.quote-dialog {
  width:min(520px,calc(100% - 32px)); max-height:calc(100svh - 32px); overflow:auto;
  border:1px solid var(--form-accent-border); border-radius:22px; background:var(--form-surface);
  padding:clamp(22px,4vw,30px); box-shadow:0 24px 80px #0e0f0b73;
}

.quote-dialog::backdrop { background:#0e0f0bb8; backdrop-filter:blur(8px); }
.quote-dialog h2 { margin:0 0 12px; font-size:20px; font-weight:700; color:var(--accent); }
.quote-dialog p { margin:0 0 20px; color:var(--muted); font-size:14px; line-height:1.8; }

.contact-layout { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); align-items:start; gap:clamp(18px,4vw,46px); margin-top:22px; }
.contact-layout .inquiry-form { margin-top:0; }

/* //수정: Panel, input and accent colors from the supplied estimate sample.// */
body {

  --estimate-lime:var(--accent);
  --estimate-lime-hover:#c4e25e;
  --estimate-mint:var(--accent);
  --estimate-shadow:0 12px 32px -8px #0009;
  --estimate-glow:0 0 24px #b2d24a47;
}
body.light {
  --estimate-ground:#f3f6f5;
  --estimate-surface:#fff;
  --estimate-elevated:#f0f3f2;
  --estimate-border:#d8e0dd;
  --estimate-border-hover:#aab8b2;
  --estimate-text:#17211d;
  --estimate-muted:#53645c;
  --estimate-mint:var(--accent);
  --estimate-shadow:0 12px 30px -12px #23382d40;
  --estimate-glow:0 4px 18px #b2d24a40;

#contact-page { color:var(--estimate-text); }
.quote-calculator h2, #contact-page h1 {
  font-size:clamp(27px,4vw,40px); letter-spacing:-.045em; line-height:1.18; font-weight:800;
}
.quote-lead, #contact-page .contact-intro { color:var(--estimate-muted); max-width:70ch; }
.quote-fields, .quote-summary, #contact-page .inquiry-form {
  background:var(--estimate-surface); border:1px solid var(--estimate-border); border-radius:24px;
  padding:clamp(16px,3vw,32px); box-shadow:var(--estimate-shadow);
}
.quote-fields { gap:20px; }
.quote-row { gap:12px; }
.quote-group { border-top-color:var(--estimate-border); padding-top:19px; }
.quote-group h3 { font-size:15px; margin:0 0 12px; }
.quote-group p { color:var(--estimate-muted); }
.quote-select-row, .quote-field {
  min-width:0; color:var(--estimate-text); background:var(--estimate-elevated);
  border:1px solid var(--estimate-border); border-radius:16px; padding:11px 12px; min-height:59px;
  font-size:13px; font-weight:600; transition:border-color .2s ease,background-color .2s ease;
}

    <div id="contact-faq-items"><details><summary>자료 준비중인데 예약 가능한가요?</summary><p>자료 준비중에도 주문 및 입금절차가 완료되면 예약은 가능합니다. 단, 협의된 자료 준비 완료일 초과, 단순 변심, 작업일정 변경 등의 사유로 주문 취소 시 위약금 10%를 제외한 90% 금액만 환불 가능합니다.</p></details><details><summary>추가 수정은 불가능한가요?</summary><p>포함된 수정 횟수와 추가 수정 비용은 제작 타입과 작업 범위에 따라 견적 및 문의 단계에서 안내합니다.</p></details><details><summary>약관 외 내용으로 계약을 진행하고 싶습니다.</summary><p>별도 계약서 작성이나 서명이 필요한 경우 아트머그의 작가 문의로 내용을 알려 주세요.</p></details><details><summary>이 페이지에서 바로 주문할 수 있나요?</summary><p>이 작성기에서 양식을 복사해 아트머그 작가 문의로 보내 주세요. 일정과 견적을 협의한 뒤 아트머그 주문 절차를 진행합니다.</p></details></div>
    <section class="contact-terms" aria-labelledby="contact-terms-heading">
      <h2 id="contact-terms-heading">이용약관</h2>
      <div id="contact-terms-scroll" class="contact-terms-scroll" role="region" aria-labelledby="contact-terms-heading" tabindex="0"><section><h3>용역 제공과 저작권리</h3><p>모든 주문 건에 대하여 Studio DW는 작업에 필요한 인력을 제공하는 것으로, 모든 작업물에 대한 저작권은 Studio DW에 귀속됩니다. 수령 완료한 작업물의 편집권 및 저작권 양도는 제공되지 않으며, 별도 라이선스 구매 시에만 해당 권리가 이전됩니다.</p></section><section><h3>표기 의무</h3><p>작업물을 온라인에 업로드할 경우, Studio DW를 명시해야 합니다. 이를 이행하지 않을 경우, Studio DW는 사용 중지 요청 및 손해배상 청구(최대 주문 체결 금액의 10배) 등의 법적 조치를 취할 수 있습니다.</p></section><section><h3>작업물 사용 제한 (방송용)</h3><p>Studio DW에서 제공한 방송용 PV 영상은 [수익창출이 되지 않는 형태의 온라인 업로드(X(구 twitter)제외) / 1회성 라이브스트리밍] 용도로만 사용 가능합니다. 그 외 기타용도로 사용하고자 할 경우 사전 협의가 필요합니다.</p></section><section><h3>수익 창출 라이선스</h3><p>수익 창출 목적의 활용 [컨텐츠 또는 리액션 영상 등의 활용 등 2차 소비 / Super Thanks 및 후원 기능 / 지속적 스트리밍 / 오프라인 상영 등] 에는 반드시 수익 창출 라이선스가 필요합니다.</p></section><section><h3>비허가된 수정 및 사용 금지(공통)</h3><p>사전 협의 없이 작업물을 2차 가공, 협의 내용외 사용 적발시 무단 사용 및 저작권리 침해로 간주하며, Studio DW는 사용 중지 요청 및 손해배상 청구(최대 주문 체결 금액의 10배) 등의 법적 조치를 취할 수 있습니다.</p></section><section><h3>실적 활용 권한</h3><p>모든 작업물은 게시물 업로드 및 삭제 여부와 관계없이 Studio DW의 실적 증명 목적으로 사용될 수 있습니다.</p></section><section><h3>제3자 및 작가 동의 간주</h3><p>Studio DW는 영상 작업 시 진행하는 보정 및 완성된 작업물의 실적 증명 자료 활용에 대하여, 작업물에 포함된 자료를 작업한 일러스트/음원 작가의 동의를 받은 것으로 간주합니다.</p></section><section><h3>주문단계 절차 준수</h3><p>Studio DW는 상호 권익 보호와 행정업무 효율화를 위하여 &quot;신청양식&quot; 작성 시스템을 도입하고 있습니다. Studio DW는 &quot;신청양식&quot;없이 진행하는 문의 및 주문에 대한 작업 문의는 무대응 또는 반려할 수 있습니다.</p></section><section><h3>예약 및 환불</h3><p>본 페이지를 통해 진행되는 모든 주문 건은 작업 일정에 따라 예약을 진행할 수 있습니다. 예약은 주문 및 입금이 모두 완료된 주문건에 한하여 진행되며, 영상 작업에 필요한 자료가 준비되지 않은 상태에서 예약을 진행할 경우 의뢰자는 Studio DW가 안내하는 작업 시작일 이전까지 영상 작업에 필요한 모든 자료를 전달해야합니다. 작업시작일 당일까지 자료전달이 진행되지 않을 경우 ①작업순번 최후순위 배정 ②위약금(전체견적의 10%) 등 불이익이 있을 수 있습니다. 또한 예약 이후 단순 변심 또는 일정 변동 등의 사유로 예약을 취소 및 환불을 신청할 경우 위약금(전체금액의 10%)를 제외한 금액만 환불 가능합니다.</p></section><section><h3>수정 및 피드백 조건</h3><p>① 스탠다드/디자인세트 : 오탈자 또는 작업 간 실수로 발생한 문제 외에는 피드백 없이 진행합니다.
② 시그니처 : 오탈자 또는 작업 간 실수로 발생한 문제 외에 1회 무료 수정이 가능하며, 이후 수정 작업은 회당 별도 요금이 부과됩니다. [시그니처: 50,000KRW]
③ 작업물 전달 이후 24시간 이내 피드백 전달, 또는 의사 전달이 진행되지 않으면 &#x27;수정사항 없음&#x27;으로 간주합니다.</p></section><section><h3>음원(오디오파일)</h3><p>오디오 파일 변경은 보컬 싱크에 변동이 없는 경우에 한해 1회 무료 제공됩니다. 보컬 싱크 변동으로 인한 수정요청은 무료 피드백 횟수에 포함되지 않습니다. Mix 작업이 완료되지 않아 원곡 음원으로 작업을 희망하시는 경우 원곡음원을 전달해주셔야 합니다.</p></section><section><h3>PV 영상 규정</h3><p>① 커버곡 PV 영상은 보컬 1인을 기준으로 제작되며, 추가 인원이 필요한 경우 별도 옵션 추가가 필요합니다.
② 기본제공 타임라인은 오디오 파일 기준 3분 30초로, 초과시 별도 옵션추가가 필요합니다.
③ 배경이 없는 인물 단일 일러스트의 경우 2D/3D 배경 추가 옵션이 견적에 포함될 수 있습니다. (기본 컴포시팅 외 배경)</p></section><section><h3>마감 기한</h3><p>타입별 마감 기한은 평균 작업 기간 기준이며, 작업 난이도 또는 일정에 따라 1-2일의 지연이 발생할 수 있습니다. 최초 피드백 진행 시 마감 기간이 초과될 수 있으며, 주문 또는 피드백 과정에서 전달 누락 또는 작성하지 않은 요청으로 인한 수정 요청은 작업 진행도에 따라 반려될 수 있습니다.</p></section><section><h3>유사 작업물 구성</h3><p>유사한 곡 또는 비슷한 구성의 작업물은 연출 및 디자인이 비슷할 수 있습니다. 음원의 동일 구간에 대한 별도의 연출 작업은 진행하지 않습니다.</p></section><section><h3>작업물 전달 보관 기한</h3><p>모든 작업물의 보관 기한은 수령완료 처리 이후 30일입니다. 납품 당시 생성된 링크는 30일이 지난 후에 삭제되며, 완성된 작업물은 상시 백업해두고 있으나 프로젝트 파일은 삭제 또는 작업 불가 상태일 수 있습니다.</p></section><section><h3>책임 한계</h3><p>모든 주문 건에 대해 본 안내문을 충분히 숙지하고 동의한 것으로 간주되며, 이를 확인하지 않아 발생하는 문제에 대해서는 Studio DW는 일절 책임지지 않습니다.</p></section></div>

<script>
(() => {

/* Artmug anchors belong to the surrounding order page. Each embedded view
   uses the same HTML and renders only the section named in its fragment. */
const sections = {

const siteMedia = 'https://studiodwofficial-a11y.github.io/StudioDW_Web/';
const parentPage = 'https://artmug.kr/index.php?channel=view&uid=32541';

const offers = new Map();

try { referrer = new URL(document.referrer); } catch { /* Standalone preview. */ }

function notifyPeers(message) {

function storageKey(target) {

function offerSelection(target, value) {

function observeVisibility(node, callback, margin = '0px') {
  if (!('IntersectionObserver' in window)) { callback(true); return; }

function mountHero(hero) {
  const reels = [...hero.querySelectorAll('video')];
  const playlist = ['HERO_1.mp4', 'HERO_2.mp4', 'HERO_3.mp4', 'HERO_4.mp4', 'HERO_5.mp4'];
  let current = null;
  let next = reels[0];
  let index = 0;
  let failures = 0;
  let visible = false;
  let version = 0;
  const canPlay = () => visible && !document.hidden && !motionPreference.matches;
  function prepare() {
    if (failures >= playlist.length) return;
    next.preload = motionPreference.matches ? 'metadata' : 'auto';
    next.src = siteMedia + playlist[index];
  }
  function sync() {
    if (!visible || document.hidden) {
      reels.forEach(video => video.pause());
      return;
    }
    if (!next.hasAttribute('src')) prepare();
    if (motionPreference.matches) {
      reels.forEach(video => video.pause());
      return;
    }
    const target = current && !current.ended && !current.error ? current : next;
    if (!target.hasAttribute('src') || target.error || (target === next && failures >= playlist.length)) return;
    if (target.paused) target.play().catch(() => {});
  }
  function advance(video, token) {
    if (token !== version || video !== next || video.paused || !canPlay() || video.readyState < 2) return;
    version++;
    video.classList.add('is-front');
    const previous = current;
    current = video;
    next = reels.find(reel => reel !== current);
    previous?.classList.remove('is-front');
    failures = 0;
    index = (index + 1) % playlist.length;
    prepare();
  }
  for (const video of reels) {
    video.addEventListener('playing', () => {
      if (video !== next) return;
      const token = ++version;
      if (video.requestVideoFrameCallback) {
        video.requestVideoFrameCallback(() => advance(video, token));
        // Some browsers suppress frame callbacks on a completely occluded layer.
        setTimeout(() => advance(video, token), 180);
      } else requestAnimationFrame(() => advance(video, token));
    });
    video.addEventListener('ended', sync);
    video.addEventListener('error', () => {
      if (video === next) {
        version++;
        failures++;
        index = (index + 1) % playlist.length;
        prepare();
      }
      sync();
    });
  }
  observeVisibility(hero, state => { visible = state; sync(); });
  motionPreference.addEventListener('change', sync);
  document.addEventListener('visibilitychange', sync);
}

function mountPrice(container) {
  const panels = [...container.querySelectorAll('.price-panel')];
  let near = false;
  const prepare = video => {
    if (!video.hasAttribute('src')) video.src = siteMedia + video.dataset.src + '#t=0.05';
  };
  function stop(card) {
    card.dataset.play = '';
    card.querySelector('video').pause();
    card.classList.remove('is-playing');
  }
  for (const card of panels) {
    const video = card.querySelector('video');
    const showFrame = () => card.classList.add('has-frame');
    video.addEventListener('loadeddata', showFrame);
    video.addEventListener('seeked', showFrame);
    video.addEventListener('playing', () => {
      if (!card.dataset.play || !near || document.hidden || motionPreference.matches) return stop(card);
      showFrame();
      card.classList.add('is-playing');
    });
    video.addEventListener('pause', () => card.classList.remove('is-playing'));
    video.addEventListener('error', () => { stop(card); card.classList.remove('has-frame'); });
    card.addEventListener('pointerenter', event => {
      if (event.pointerType !== 'mouse' || motionPreference.matches || document.hidden) return;
      panels.filter(other => other !== card).forEach(stop);
      near = true;
      prepare(video);
      if (video.error) video.load();
      card.dataset.play = 'yes';
      video.play().catch(() => {});
    });
    card.addEventListener('pointerleave', () => stop(card));
    card.querySelector('a').addEventListener('click', event => {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      visitSection('estimate', {tier:card.dataset.tier});
    });
  }
  observeVisibility(container, state => {
    near = state;
    if (state) panels.forEach(card => prepare(card.querySelector('video')));
    else panels.forEach(stop);
  }, '80px');
  document.addEventListener('visibilitychange', () => { if (document.hidden) panels.forEach(stop); });
  motionPreference.addEventListener('change', () => { if (motionPreference.matches) panels.forEach(stop); });
}

/* The three mood labels are editable per work in the portfolioWorks list. */
function mountPortfolio(section) {
  const works = portfolioWorks.filter(work => work.tier === section.dataset.portfolio);
  const track = section.querySelector('.pf-track');
  const empty = section.querySelector('.pf-empty');
  const title = section.querySelector('.pf-caption');
  const counter = section.querySelector('.pf-count');
  const watch = section.querySelector('.pf-external');
  const previous = section.querySelector('.pf-prev');
  const next = section.querySelector('.pf-next');
  const filters = [...section.querySelectorAll('[data-mood]')];
  let current = 0;
  let list = [];
  let player = null;
  let imageObserver = null;
  let scrolling = false;

  function requestImage(slide) {
    const image = slide.querySelector('img');
    if (!image || image.hasAttribute('src')) return;
    const choices = ['maxresdefault', 'sddefault', 'hqdefault', 'mqdefault'];
    let quality = 0;
    const update = () => { image.src = 'https://i.ytimg.com/vi/' + slide.dataset.id + '/' + choices[quality] + '.jpg'; };
    const fallback = () => {
      if (quality + 1 < choices.length) { quality++; update(); }
      else image.hidden = true;
    };
    image.addEventListener('error', fallback);
    image.addEventListener('load', () => { if (image.naturalWidth <= 120 && quality + 1 < choices.length) fallback(); });
    update();
  }
  function stopPlayer() {
    if (!player) return;
    const slide = player.parentElement;
    player.remove();
    slide.querySelector('button').hidden = false;
    player = null;
  }
  function select(index) {
    if (!list.length) return;
    if (index !== current) stopPlayer();
    current = Math.min(list.length - 1, Math.max(0, index));
    const work = list[current];
    title.textContent = work.title;
    counter.textContent = String(current + 1).padStart(2, '0') + ' / ' + String(list.length).padStart(2, '0');
    watch.href = 'https://www.youtube.com/watch?v=' + work.id;
    watch.setAttribute('aria-label', work.title + ' · YouTube에서 보기');
    previous.disabled = current === 0;
    next.disabled = current >= list.length - 1;
    for (const [i, child] of [...track.children].entries()) {
      child.querySelector('button').tabIndex = i === current ? 0 : -1;
      child.setAttribute('aria-hidden', String(i !== current));
    }
  }
  function move(index) {
    if (!list.length) return;
    const bounded = Math.max(0, Math.min(index, list.length - 1));
    const slide = track.children[bounded];
    requestImage(slide);
    track.scrollTo({left:slide.offsetLeft, behavior:motionPreference.matches ? 'instant' : 'smooth'});
  }
  function slideFor(work, index) {
    const slide = document.createElement('div');
    slide.className = 'pf-slide';
    slide.dataset.id = work.id;
    slide.setAttribute('role','group');
    slide.setAttribute('aria-label', (index + 1) + ' / ' + list.length);
    const button = document.createElement('button');
    button.className = 'pf-poster';
    button.type = 'button';
    button.setAttribute('aria-label', work.title + ' 재생');
    const image = document.createElement('img');
    image.alt = '';
    image.width = 1280;
    image.height = 720;
    image.decoding = 'async';
    const play = document.createElement('span');
    play.className = 'pf-play';
    play.setAttribute('aria-hidden','true');
    button.append(image, play);
    button.addEventListener('click', () => {
      stopPlayer();
      document.dispatchEvent(new CustomEvent('dw-work-play', {detail:section}));
      notifyPeers({kind:'work-play'});
      select(index);
      requestImage(slide);
      const video = document.createElement('iframe');
      video.title = work.title;
      video.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
      video.allowFullscreen = true;
      video.referrerPolicy = 'strict-origin-when-cross-origin';
      video.src = 'https://www.youtube-nocookie.com/embed/' + work.id + '?autoplay=1&playsinline=1';
      player = video;
      button.hidden = true;
      slide.append(video);
      video.focus({preventScroll:true});
    });
    slide.append(button);
    return slide;
  }
  function filterBy(mood) {
    stopPlayer();
    imageObserver?.disconnect();
    current = 0;
    list = works.filter(work => mood === '전체' || work.moods.includes(mood));
    filters.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mood === mood)));
    track.replaceChildren(...list.map(slideFor));
    track.scrollLeft = 0;
    track.hidden = !list.length;
    empty.hidden = Boolean(list.length);
    watch.hidden = !list.length;
    if (!list.length) {
      empty.querySelector('p').textContent = '이 타입에는 ‘' + mood + '’로 분류한 작품이 아직 없습니다.';
      title.textContent = '';
      counter.textContent = '0 / 0';
      previous.disabled = next.disabled = true;
      return;
    }
    select(0);
    if ('IntersectionObserver' in window) {
      imageObserver = new IntersectionObserver(entries => {
        for (const entry of entries) if (entry.isIntersecting) {
          requestImage(entry.target);
          imageObserver.unobserve(entry.target);
        }
      });
      [...track.children].forEach(slide => imageObserver.observe(slide));
    } else requestImage(track.children[0]);
  }

  previous.addEventListener('click', () => move(current - 1));
  next.addEventListener('click', () => move(current + 1));
  track.addEventListener('keydown', event => {
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    track.focus({preventScroll:true});
    move(current + (event.key === 'ArrowLeft' ? -1 : 1));
  });
  track.addEventListener('scroll', () => {
    if (scrolling || !track.clientWidth) return;
    scrolling = true;
    requestAnimationFrame(() => {
      scrolling = false;
      if (track.clientWidth && list.length) {
        select(Math.round(track.scrollLeft / track.clientWidth));
        requestImage(track.children[current]);
      }
    });
  }, {passive:true});
  filters.forEach(button => button.addEventListener('click', () => filterBy(button.dataset.mood)));
  empty.querySelector('button').addEventListener('click', () => { filterBy('전체'); filters[0].focus(); });
  document.addEventListener('dw-work-play', e => { if (e.detail !== section) stopPlayer(); });
  window.addEventListener('message', e => {
    if (e.origin === location.origin && e.data?.protocol === protocol && e.data.kind === 'work-play') stopPlayer();
  });
  observeVisibility(section, visible => { if (!visible) stopPlayer(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopPlayer(); });
  filterBy('전체');
}

function mountDesignSamples(section) {
  const details = section.querySelector('.design-samples');
  const track = details.querySelector('.design-track');
  const controls = [...details.querySelectorAll('button[data-step]')];
  const count = details.querySelector('output');
  function update() {
    if (!track.clientWidth) return;
    const index = Math.round(track.scrollLeft / track.clientWidth);
    count.value = (index + 1) + ' / ' + track.children.length;
    controls[0].disabled = index === 0;
    controls[1].disabled = index >= track.children.length - 1;
  }
  details.addEventListener('toggle', () => {
    if (!details.open) return;
    for (const img of track.querySelectorAll('img[data-src]')) {
      img.src = img.dataset.src;
      img.removeAttribute('data-src');
    }
    update();
  });
  controls.forEach(button => button.addEventListener('click', () => {
    const index = Math.round(track.scrollLeft / track.clientWidth) + Number(button.dataset.step);
    track.scrollTo({left:index * track.clientWidth, behavior:motionPreference.matches ? 'instant' : 'smooth'});
  }));
  track.addEventListener('scroll', update, {passive:true});
  if ('ResizeObserver' in window) new ResizeObserver(update).observe(track);
}

const quoteAddons={live2d:['live2d',quoteRates.additional.live2dStarting],thumbnailLogo:['thumb',quoteRates.additional.thumbnailLogo],shorts:['shorts',quoteRates.additional.shorts]};
const formatQuoteAmount=new Intl.NumberFormat('ko-KR');
const quoteMoney=amount=>formatQuoteAmount.format(amount)+' KRW';
const startingQuoteLabels={ko:amount=>amount+'부터',ja:amount=>amount+'〜',en:amount=>'from '+amount};
document.querySelectorAll('[data-package-price]').forEach(amount=>{
  amount.textContent=formatQuoteAmount.format(quoteRates.packages[amount.dataset.packagePrice]);
});
function buildQuote(q,copy,labels) {
  const items=[{label:q.tier.toUpperCase(),amount:quoteRates.packages[q.tier]}];
  const add=(label,amount)=>items.push({label,amount});
  const vocals=Math.max(0,q.vocalists-1);
  const over=Math.max(0,q.duration-210);
  const blocks=Math.floor(over/30);
  const original=q.tier==='original';
  if (!original && vocals) add(labels.vocalExtra+' × '+vocals,vocals*quoteRates.vocalist[q.tier]);
  if (!original && blocks) add(labels.durationExtra+' × '+blocks+' × 30s',blocks*quoteRates.duration30sec[q.tier]);
  for (const [key,rate] of Object.entries(quantityRates)) {
    const quantity=q.background[key];
    if(quantity && (q.tier!=='standard'||key==='twoD')) add(copy[key]+' × '+quantity,rate*quantity);
  }
  for (const [key,[label,rate]] of Object.entries(quoteAddons)) if(q[key]) add(copy[label],rate);
  const subtotal=items.reduce((sum,item)=>sum+item.amount,0);
  if(q.commercial && !original) add(copy.license,quoteRates.commercialLicense[q.tier]);
  if(q.rush) add(copy.rush+' × '+q.multiplier,Math.round(subtotal*q.multiplier)-subtotal);
  const notes=[];
  if(over%30) notes.push(copy.partial);
  if(q.background.threeD||q.background.ue5||q.live2d||q.rush) notes.push(copy.variable);
  if(q.rush) notes.push(copy.rushNote);
  if(original&&(vocals||over)) notes.push(labels.originalExtras);
  return {items,notes,total:items.reduce((sum,item)=>sum+item.amount,0)};
}
function durationLabel(seconds) {
  return Math.floor(seconds/60)+'m '+String(seconds%60).padStart(2,'0')+'s';
}
const quoteWorkDescriptions = {
  ko:{
    twoD:'2D 배경 디자인',threeD:'3D 공간 및 배경 디자인',ue5:'Unreal Engine 5 배경 제작',
    live2d:'일러스트에 캐릭터 움직임 적용',thumbnailLogo:'영상 썸네일과 로고 디자인',shorts:'Shorts 및 SNS용 영상 출력'
  },
  ja:{
    twoD:'2D背景のデザイン',threeD:'3D空間と背景のデザイン',ue5:'Unreal Engine 5で背景を制作',
    live2d:'イラストにキャラクターの動きを追加',thumbnailLogo:'動画サムネイルとロゴの制作',shorts:'Shorts・SNS向けの動画書き出し'
  },
  en:{
    twoD:'2D background artwork',threeD:'3D environment and background design',ue5:'Background production in Unreal Engine 5',
    live2d:'Character motion for supplied artwork',thumbnailLogo:'Video thumbnail and logo design',shorts:'Video export for Shorts and social media'
  }
};


function mountCalculator(calculator) {
const quoteOptions={
  tier:'standard', vocalists:1, duration:210, background:{twoD:0,threeD:0,ue5:0},
  live2d:false, thumbnailLogo:false, shorts:false, commercial:false, rush:false, multiplier:1.5
};
function renderQuoteCalculator() {
  const copy=quoteCopy[homeLocale], labels=quoteUi[homeLocale], q=quoteOptions;
  const options=Array.from({length:16},(_,index)=>{
    const seconds=(index+1)*30;
    return '<option value="'+seconds+'"'+(q.duration===seconds?' selected':'')+'>'+durationLabel(seconds)+'</option>';
  }).join('');
  function switchControl(key,disabled=false) {
    return '<input type="checkbox" role="switch" data-quote="'+key+'"'+(q[key]&&!disabled?' checked':'')+(disabled?' disabled':'')+'>';
  }
  function checkbox(key,label,disabled=false) {
    return '<label class="quote-field"><span class="quote-option-copy"><strong>'+safeText(label)+'</strong></span>'+switchControl(key,disabled)+'</label>';
  }
  function workRow(key,title,rate,control,starting=false) {
    const amount=quoteMoney(rate);
    const price=starting ? startingQuoteLabels[homeLocale](amount) : amount;
    const description=quoteWorkDescriptions[homeLocale][key];
    return '<label class="quote-work-row"><strong class="quote-work-name">'+safeText(title)+'</strong>'+
      '<span class="quote-work-description">'+safeText(description)+'</span>'+
      '<span class="quote-work-price quote-number">'+safeText(price)+'</span>'+
      '<span class="quote-work-control">'+control+'</span></label>';
  }
  const background=Object.keys(quantityRates).map(key=>{
    const disabled=q.tier==='standard'&&key!=='twoD';
    const choices=Array.from({length:4},(_,quantity)=>
      '<option value="'+quantity+'"'+(q.background[key]===quantity?' selected':'')+'>'+quantity+'</option>'
    ).join('');
    return workRow(key,copy[key],quantityRates[key],'<select aria-label="'+safeText(copy[key]+' '+labels.quantity)+'" data-background="'+key+'"'+(disabled?' disabled':'')+'>'+choices+'</select>',key!=='twoD');
  }).join('');
  const addons=Object.entries(quoteAddons).map(([key,[label,rate]])=>workRow(key,copy[label],rate,switchControl(key),key==='live2d')).join('');
  calculator.innerHTML='<p class="eyebrow">'+copy.eyebrow+'</p><h2 id="quote-heading">'+safeText(copy.title)+'</h2><p class="quote-lead">'+safeText(copy.lead)+'</p>'+
    '<div class="quote-layout"><div class="quote-fields"><div class="quote-selected"><span>'+safeText(copy.package)+'</span><strong>'+q.tier.toUpperCase()+'</strong></div>'+
    '<section class="quote-group quote-basics"><h3>'+labels.basics+'</h3><div class="quote-row">'+
    '<label class="quote-select-row"><span class="quote-option-copy"><strong>'+copy.vocalist+'</strong><small>'+safeText(copy.vocalistHint)+'</small></span><input type="number" inputmode="numeric" min="1" max="20" step="1" data-quote="vocalists" value="'+q.vocalists+'"></label>'+
    '<label class="quote-select-row"><span class="quote-option-copy"><strong>'+copy.duration+'</strong><small>'+safeText(copy.durationHint)+'</small></span><select data-quote="duration">'+options+'</select></label></div></section>'+
    '<section class="quote-group"><h3>'+copy.background+'</h3><div class="quote-row quote-backgrounds">'+background+'</div></section>'+
    '<section class="quote-group"><h3>'+copy.additional+'</h3><div class="quote-row quote-addons">'+addons+'</div></section>'+
    '<section class="quote-group"><h3>'+copy.usage+'</h3><div class="quote-row quote-usage">'+checkbox('commercial',copy.license,q.tier==='original')+checkbox('rush',copy.rush)+
    '<label class="quote-select-row" id="quote-rush-row"'+(q.rush?'':' hidden')+'><span>'+labels.rushRate+'</span><select data-quote="multiplier"><option value="1.5"'+(q.multiplier===1.5?' selected':'')+'>×1.5</option><option value="2"'+(q.multiplier===2?' selected':'')+'>×2.0</option></select></label></div></section></div>'+
    '<aside class="quote-summary"><p class="eyebrow">'+copy.estimate+'</p><p class="quote-total quote-number" id="quote-total" aria-live="polite"></p><p>'+copy.estimateNote+'</p>'+
    '<section class="quote-review" aria-labelledby="quote-review-title"><h3 id="quote-review-title">'+labels.selected+'</h3>'+
    '<dl class="quote-review-settings" id="quote-review-settings"></dl><dl class="quote-review-lines" id="quote-review-lines"></dl>'+
    '<p id="quote-review-empty" hidden>'+labels.noAddons+'</p></section>'+
    '<ul class="quote-notes" id="quote-notes" hidden></ul>'+
    '<button type="button" class="commerce-action" id="quote-to-contact">'+copy.quote+' ↗</button></aside></div>'+
    '<dialog class="quote-dialog" id="quote-live-notice" aria-labelledby="quote-live-title"><h2 id="quote-live-title">Live2D</h2><p>'+safeText(labels.liveNotice)+'</p><form method="dialog"><button class="commerce-action" autofocus>'+labels.close+'</button></form></dialog>';
  updateQuoteTotal();
}
function updateQuoteTotal() {
  const q=quoteOptions, copy=quoteCopy[homeLocale], labels=quoteUi[homeLocale];
  const result=buildQuote(q,copy,labels);
  calculator.querySelector('#quote-total').textContent=quoteMoney(result.total);
  const reviewRow=(label,value)=>'<div><dt>'+safeText(label)+'</dt><dd>'+safeText(value)+'</dd></div>';
  calculator.querySelector('#quote-review-settings').innerHTML=
    reviewRow(copy.vocalist,String(q.vocalists))+reviewRow(copy.duration,durationLabel(q.duration));
  const [base,...additions]=result.items;
  calculator.querySelector('#quote-review-lines').innerHTML=reviewRow(labels.base,quoteMoney(base.amount))+
    additions.map(item=>reviewRow(item.label,quoteMoney(item.amount))).join('');
  calculator.querySelector('#quote-review-empty').hidden=additions.length>0;
  const notes=calculator.querySelector('#quote-notes');
  notes.hidden=!result.notes.length;
  notes.innerHTML=result.notes.map(note=>'<li>'+safeText(note)+'</li>').join('');
}
function selectQuoteTier(tier) {
  if (quoteOptions.tier===tier) return;
  quoteOptions.tier=tier;
  if(tier==='standard') quoteOptions.background.threeD=quoteOptions.background.ue5=0;
  if(tier==='original') quoteOptions.commercial=false;
  renderQuoteCalculator();
}
calculator.addEventListener('change',event=>{
  const field=event.target, key=field.dataset.quote;
  if (field.dataset.background) {
    quoteOptions.background[field.dataset.background]=Number(field.value);
    updateQuoteTotal();
    return;
  }
  if (!key) return;
  if (field.type==='checkbox') quoteOptions[key]=field.checked;
  else if (key==='vocalists') {
    quoteOptions.vocalists=Math.min(20,Math.max(1,Math.round(Number(field.value)||1)));
    field.value=quoteOptions.vocalists;
  } else quoteOptions[key]=Number(field.value);
  if (key==='rush') {
    calculator.querySelector('#quote-rush-row').hidden=!quoteOptions.rush;
    if (!quoteOptions.rush) {
      quoteOptions.multiplier=1.5;
      calculator.querySelector('[data-quote="multiplier"]').value='1.5';
    }
  }
  updateQuoteTotal();
  if(key==='live2d'&&field.checked) calculator.querySelector('#quote-live-notice').showModal();
});
calculator.addEventListener('input',event=>{
  const field=event.target;
  if(field.dataset.quote!=='vocalists'||!field.validity.valid||field.value==='') return;
  quoteOptions.vocalists=Number(field.value);
  updateQuoteTotal();
});

  handlers.set('estimate', value => {
    if (!workTypes.includes(value?.tier)) return false;
    selectQuoteTier(value.tier);
    return true;
  });
  calculator.addEventListener('click', event => {
    if (event.target.closest('#quote-to-contact')) visitSection('contact', {...quoteOptions, background:{...quoteOptions.background}});
  });
  renderQuoteCalculator();
}

function mountContact(inquiry) {
  const inquiryService = document.getElementById('inquiry-service');
  const inquiryMessage = document.getElementById('inquiry-message');
  let inquiryQuoteTier, inquiryQuote;
const inquiryQuoteCopy = {
  ko: {title:'PRICE에서 가져온 추가 옵션', empty:'PRICE에서 견적을 구성하고 ‘이 구성으로 문의 작성’을 누르면 여기에서 확인할 수 있습니다.', mismatch:'PRICE에서 가져온 제작 타입은 {tier}입니다. 신청 타입을 {tier}로 선택하면 옵션이 반영됩니다.'},
  ja: {title:'PRICEから引き継いだ追加オプション', empty:'PRICEで見積もりを作成し、「この内容で問い合わせる」を押すと、ここで確認できます。', mismatch:'PRICEから引き継いだプランは{tier}です。申込プランで{tier}を選択するとオプションが反映されます。'},
  en: {title:'Additional options from PRICE', empty:'Build an estimate in PRICE and choose “Continue to contact with this quote” to see your options here.', mismatch:'The imported quote is for {tier}. Select {tier} as your inquiry tier to apply its options.'}
};
const inquiryQuoteTitle = document.getElementById('inquiry-quote-title');
const inquiryQuoteDetails = document.getElementById('inquiry-quote-details');

function hasInquiryQuote(service) {
  return Boolean(inquiryQuoteTier && inquiryQuote && service?.toLowerCase() === inquiryQuoteTier);
}

function renderInquiryQuote() {
  const messages = inquiryQuoteCopy[homeLocale];
  inquiryQuoteTitle.textContent = messages.title;
  if (!hasInquiryQuote(inquiryService.value)) {
    const message = inquiryQuoteTier
      ? messages.mismatch.replaceAll('{tier}', inquiryQuoteTier.toUpperCase())
      : messages.empty;
    inquiryQuoteDetails.innerHTML = '<p>'+safeText(message)+'</p>';
    return;
  }
  const copy = quoteCopy[homeLocale], labels = quoteUi[homeLocale];
  const {items, notes} = buildQuote(inquiryQuote, copy, labels);
  const options = items.slice(1);
  inquiryQuoteDetails.innerHTML =
    '<p>'+safeText([inquiryQuoteTier.toUpperCase(), copy.vocalist+' '+inquiryQuote.vocalists, copy.duration+' '+durationLabel(inquiryQuote.duration)].join(' · '))+'</p>'+
    (options.length
      ? '<ul>'+options.map(({label}) => '<li>'+safeText(label)+'</li>').join('')+'</ul>'
      : '<p>'+safeText(labels.noAddons)+'</p>')+
    notes.map(note => '<p>'+safeText(note)+'</p>').join('');
}

inquiryService.addEventListener('change', renderInquiryQuote);
window.addEventListener('pageshow', renderInquiryQuote);

function quoteTransferText() {
  const copy=quoteCopy[homeLocale], labels=quoteUi[homeLocale];
  const result=buildQuote(inquiryQuote,copy,labels);
  return [
    copy.package+' / '+inquiryQuote.tier.toUpperCase(),
    copy.vocalist+' / '+inquiryQuote.vocalists,
    copy.duration+' / '+durationLabel(inquiryQuote.duration),
    ...result.items.slice(1).map(item=>item.label+' / '+quoteMoney(item.amount)),
    copy.estimate+' / '+quoteMoney(result.total),
    ...result.notes
  ].join("\n");
}
function inquiryLabel(key) {
  return inquiry.querySelector('[data-page-copy="'+key+'"]').textContent;
}
const creditSelect=inquiry.elements.namedItem('credits');
const creditText=inquiry.elements.namedItem('creditText');
const creditRow=document.getElementById('credit-text-row');
function syncCreditField() {
  const included=creditSelect.checked;
  creditRow.hidden=!included;
  creditText.disabled=!included;
}
creditSelect.addEventListener('change',syncCreditField);
window.addEventListener('pageshow',syncCreditField);
syncCreditField();

const inquirySubmit=inquiry.querySelector('.inquiry-complete');
const validationHint=document.getElementById('inquiry-validation');
const inquiryErrorDialog=document.getElementById('inquiry-error-dialog');
const inquiryErrorList=document.getElementById('inquiry-error-list');
const validationCopy={
  ko:{
    summary:'작성완료 전에 다음 항목을 확인해 주세요.',
    input:'필수 입력값이 비어 있습니다.',
    select:'필수 항목을 선택해 주세요.',

    invalid:'입력값의 형식을 확인해 주세요.'
  },
  ja:{
    summary:'記入を完了する前に、次の項目をご確認ください。',
    input:'必須項目を入力してください。',
    select:'必須項目を選択してください。',

    invalid:'入力形式をご確認ください。'
  },
  en:{
    summary:'Check these fields before completing the form.',
    input:'Enter a value for this required field.',
    select:'Choose a value for this required field.',

    invalid:'Check the format of this value.'
  }
};
function collectInquiryIssues() {
  const copy=validationCopy[homeLocale];
  const issues=[];
  for (const field of inquiry.elements) {
    if (!field.name || !field.willValidate) continue;
    const value=field.value.trim();
    let reason;
    if (field.required && !value) reason=field.tagName === 'SELECT' ? copy.select : copy.input;
    else if (!field.validity.valid) reason=copy.invalid;
    if (reason) issues.push({field,label:inquiryLabel(field.name),reason});
  }
  return issues;
}
function inquiryIssueItems(issues) {
  return issues.map(({label,reason})=>'<li><strong>'+safeText(label)+'</strong><span>'+safeText(reason)+'</span></li>').join('');
}
function syncInquiryValidity(issues=collectInquiryIssues()) {
  const valid=issues.length===0;
  //수정: The submit action is blocked while invalid, but the control can still explain the errors.//
  inquirySubmit.setAttribute('aria-disabled',String(!valid));
  validationHint.hidden=valid;
  const message=valid?'':'<p>'+validationCopy[homeLocale].summary+'</p><ul>'+inquiryIssueItems(issues)+'</ul>';
  if (validationHint.innerHTML!==message) validationHint.innerHTML=message;
  if (inquiryErrorDialog.open) inquiryErrorList.innerHTML=inquiryIssueItems(issues);
  return valid;
}
function refreshInquiryValidity() { syncInquiryValidity(); }
inquiry.addEventListener('input',refreshInquiryValidity);
inquiry.addEventListener('change',refreshInquiryValidity);
window.addEventListener('pageshow',refreshInquiryValidity);
inquiryErrorDialog.addEventListener('close',()=>{
  if (!document.getElementById('contact-page').hidden) collectInquiryIssues()[0]?.field.focus();
});
syncInquiryValidity();

function draftInquiry() {
  const fields=new FormData(inquiry);
  const service=fields.get('service');
  const rows=[];
  for (const key of ['name','channel','song','service','subtitle','assets','date','reference','details','credits','creditText']) {
    let value=key==='credits' ? inquiryLabel(creditSelect.checked?'creditsYes':'creditsNo') : fields.get(key)?.trim();
    if (!value) continue;
    const field=inquiry.elements.namedItem(key);
    if (field instanceof HTMLSelectElement) value=field.selectedOptions[0].textContent;
    rows.push(inquiryLabel(key)+' / '+value);
  }
  if (hasInquiryQuote(service)) rows.push(quoteTransferText());
  return rows.join('\n\n');
}

const inquiryDialog=document.getElementById('inquiry-complete-dialog');
const inquiryDraftStatus=document.getElementById('inquiry-draft-status');
const copySuccess={
  ko:'작성한 양식을 복사했습니다.',
  ja:'記入済みのフォームをコピーしました。',
  en:'Your completed form has been copied.'
};
let inquirySubmission=0;
async function copyInquiryDraft(selectOnFailure=false) {
  const submission=inquirySubmission;
  try {
    await navigator.clipboard.writeText(inquiryMessage.value);
    if (submission===inquirySubmission && inquiryDialog.open) inquiryDraftStatus.textContent=copySuccess[homeLocale];
  } catch {
    if (selectOnFailure && submission===inquirySubmission && inquiryDialog.open) {
      inquiryMessage.focus();
      inquiryMessage.select();
    }
  }
}
document.getElementById('inquiry-copy-draft').addEventListener('click', () => copyInquiryDraft(true));
inquiry.addEventListener('submit', event => {
  event.preventDefault();
  const issues=collectInquiryIssues();
  if (!syncInquiryValidity(issues)) {
    inquiryErrorList.innerHTML=inquiryIssueItems(issues);
    if (!inquiryErrorDialog.open) inquiryErrorDialog.showModal();
    return;
  }
  inquirySubmission++;
  inquiryMessage.value=draftInquiry();
  inquiryDraftStatus.textContent='작성한 양식을 선택해 복사할 수 있습니다.';
  inquiryDialog.showModal();
  copyInquiryDraft();
});


  function integer(value, min, max) {
    return Number.isInteger(value) && value >= min && value <= max;
  }
  handlers.set('contact', value => {
    if (!workTypes.includes(value?.tier) || !integer(value.vocalists,1,20) ||
        !integer(value.duration,30,480) || value.duration%30 || !value.background ||
        !Object.keys(quantityRates).every(key => integer(value.background[key],0,3)) ||
        ![...Object.keys(quoteAddons),'commercial','rush'].every(key => typeof value[key] === 'boolean') ||
        ![1.5,2].includes(value.multiplier)) return false;
    inquiryQuoteTier=value.tier;
    inquiryQuote={...value,background:{...value.background}};
    inquiryService.value=value.tier[0].toUpperCase() + value.tier.slice(1);
    renderInquiryQuote();
    syncInquiryValidity();
    return true;
  });
  renderInquiryQuote();
}


const hero = canvas.querySelector('.hero');
if (hero) {
  mountHero(hero);
  hero.querySelector('.scroll').addEventListener('click', event => { event.preventDefault(); visitSection('history'); });
}
canvas.querySelectorAll('[data-portfolio]').forEach(mountPortfolio);
const panels = canvas.querySelector('.price-panels');
if (panels) mountPrice(panels);
const calculator = canvas.querySelector('#price-calculator');
if (calculator) mountCalculator(calculator);
const inquiry = canvas.querySelector('#inquiry-form');
if (inquiry) mountContact(inquiry);
const optionSection = canvas.querySelector('.dw-options');
if (optionSection) mountDesignSamples(optionSection);
if (embedded && (calculator || inquiry)) {
  new MutationObserver(records => {
    for (const {target} of records) {
      if (target.tagName !== 'DIALOG' || !target.open) continue;
      requestAnimationFrame(() => {
        if (!target.open) return;
        const box = target.getBoundingClientRect();
        if (hostConnected) parentMessage('dialog',{position:box.top + window.scrollY + box.height/2});
        else target.scrollIntoView({block:'center'});
      });
    }
  }).observe(canvas, {subtree:true,attributes:true,attributeFilter:['open']});
}
enableFrameIntegration();
if (!part && location.hash) requestAnimationFrame(() => document.getElementById(location.hash.slice(1))?.scrollIntoView());

})();
