<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>썸네일 - Index 5</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap');

    /* ═══ 변수 및 기본 설정 ═══ */
    :root { 
        --point: #bada55; 
        --glow: #dcf073; 
        --bg: #0d0d0b; 
        --card: #151512; 
        --border: #2a2a26;
        --text: #e8e4de;
    }

    .dw-root * { box-sizing: border-box; margin: 0; padding: 0; }
    .dw-root {
        font-family: 'Noto Sans KR', sans-serif;
        background-color: var(--bg);
        background-image: radial-gradient(rgba(186, 218, 85, 0.08) 1px, transparent 1px);
        background-size: 24px 24px;
        color: var(--text);
        max-width: 1200px;
        margin: 0 auto;
        padding-bottom: 60px;
        line-height: 1.7;
        text-align: left;
    }

    /* ═══ 섹션 라벨 ═══ */
    .dw-section-lbl {
        display: flex; align-items: center; gap: 15px; padding: 0 40px; margin: 60px 0 40px;
        font-family: 'DM Mono', monospace; font-size: 11px; color: var(--point); letter-spacing: 0.3em; opacity: 0.6;
        justify-content: center;
    }
    .dw-section-lbl::before { content: ''; flex: 1; height: 1px; background: var(--border); }
    .dw-section-lbl::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ═══ 슬라이더 공통 ═══ */
    .dw-slider-section { position: relative; padding: 0 40px; }
    .dw-slider-outer { overflow: hidden; border-radius: 35px; }
    .dw-slider-track { display: flex; gap: 15px; transition: transform 0.5s ease; width: max-content; }
    
    /* Design Item */
    .dw-design-item { width: 350px; height: 210px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
    .dw-design-item iframe { width: 100%; height: 100%; border: none; display: block; pointer-events: none; }
    
    /* Add-on Item */
    .dw-addon-item { width: 340px; background: var(--card); border: 1.5px solid var(--border); border-radius: 20px; overflow: hidden; }
    .dw-item-preview { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 1px solid var(--border); }
    .dw-item-preview iframe { width: 100%; height: 100%; border: none; display: block; }
    
    .dw-item-info { padding: 15px 20px; }
    .dw-item-title { font-size: 16px; font-weight: 900; color: #fff; margin-bottom: 1px; }
    .dw-item-price { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--point); margin-bottom: 5px; }
    .dw-item-desc { font-size: 11px; color: #555; line-height: 1.5; }

    /* Controls */
    .dw-controls { display: flex; justify-content: center; gap: 10px; margin-top: 25px; }
    .dw-arrow-btn {
        width: 32px; height: 32px; background: #fdfdf5; border-radius: 50%; border: none;
        display: flex; align-items: center; justify-content: center;
        color: #0d0d0f; font-size: 12px; font-weight: 900; cursor: pointer; transition: 0.2s;
    }
    .dw-arrow-btn:hover { background: var(--point); transform: scale(1.1); }
</style>
</head>
<body>
<div class="dw-root">
    <!-- PORTFOLIO · DESIGN 섹션 -->
    <div class="dw-section-lbl">PORTFOLIO · DESIGN</div>
    <div class="dw-slider-section">
        <div class="dw-slider-outer">
            <div class="dw-slider-track" id="design-track">
                <div class="dw-design-item"><iframe src="about:blank"></iframe></div>
                <div class="dw-design-item"><iframe src="about:blank"></iframe></div>
                <div class="dw-design-item"><iframe src="about:blank"></iframe></div>
                <div class="dw-design-item"><iframe src="about:blank"></iframe></div>
                <div class="dw-design-item"><iframe src="about:blank"></iframe></div>
                <div class="dw-design-item"><iframe src="about:blank"></iframe></div>
                <div class="dw-design-item"><iframe src="about:blank"></iframe></div>
                <div class="dw-design-item"><iframe src="about:blank"></iframe></div>
                <div class="dw-design-item"><iframe src="about:blank"></iframe></div>
            </div>
        </div>
        <div class="dw-controls">
            <button class="dw-arrow-btn" onclick="moveSlide('design-track', -1)"> < </button>
            <button class="dw-arrow-btn" onclick="moveSlide('design-track', 1)"> > </button>
        </div>
    </div>

    <!-- ADD-ON OPTIONS 섹션 -->
    <div class="dw-section-lbl">ADD-ON OPTIONS</div>
    <div class="dw-slider-section">
        <div class="dw-slider-outer">
            <div class="dw-slider-track" id="addon-track">
                <div class="dw-addon-item">
                    <div class="dw-item-preview"><iframe src="about:blank"></iframe></div>
                    <div class="dw-item-info"><div class="dw-item-title">배경 디자인 (2D)</div><div class="dw-item-price">별도 견적</div><div class="dw-item-desc">일러스트 기반 고퀄리티 리소스 제작</div></div>
                </div>
                <div class="dw-addon-item">
                    <div class="dw-item-preview"><iframe src="about:blank"></iframe></div>
                    <div class="dw-item-info"><div class="dw-item-title">배경 디자인 (3D)</div><div class="dw-item-price">별도 견적</div><div class="dw-item-desc">3D 툴을 활용한 공간감 연출</div></div>
                </div>
                <div class="dw-addon-item">
                    <div class="dw-item-preview"><iframe src="about:blank"></iframe></div>
                    <div class="dw-item-info"><div class="dw-item-title">Live 2D 애니메이션</div><div class="dw-item-price">별도 견적</div><div class="dw-item-desc">리깅 소재를 활용한 캐릭터 모션</div></div>
                </div>
                <div class="dw-addon-item">
                    <div class="dw-item-preview"><iframe src="about:blank"></iframe></div>
                    <div class="dw-item-info"><div class="dw-item-title">디자인(썸네일)SET</div><div class="dw-item-price">별도 견적</div><div class="dw-item-desc">로고+썸네일+크레딧 패키지</div></div>
                </div>
                <div class="dw-addon-item">
                    <div class="dw-item-preview"><iframe src="about:blank"></iframe></div>
                    <div class="dw-item-info"><div class="dw-item-title">빠른 마감</div><div class="dw-item-price">별도 견적</div><div class="dw-item-desc">일정 최우선 순위 배정</div></div>
                </div>
                <div class="dw-addon-item">
                    <div class="dw-item-preview"><iframe src="about:blank"></iframe></div>
                    <div class="dw-item-info"><div class="dw-item-title">SNS/Shorts 폼 추가</div><div class="dw-item-price">별도 견적</div><div class="dw-item-desc">홍보용 숏폼 사이즈 변환</div></div>
                </div>
            </div>
        </div>
        <div class="dw-controls">
            <button class="dw-arrow-btn" onclick="moveSlide('addon-track', -1)"> < </button>
            <button class="dw-arrow-btn" onclick="moveSlide('addon-track', 1)"> > </button>
        </div>
    </div>
</div>
</body>
</html>

<script>
(function() {
    /* 슬라이더 제어 */
    const sliderIdx = { 'design-track': 0, 'addon-track': 0 };
    window.moveSlide = function(id, dir) {
        const track = document.getElementById(id);
        const gap = 15;
        const width = (id === 'design-track' ? 350 : 340) + gap;
        
        sliderIdx[id] += dir;
        
        // 슬라이드 범위 제한 (아이템 개수에 따라 조정 필요)
        if(sliderIdx[id] < 0) sliderIdx[id] = 0;
        if(sliderIdx[id] > 3) sliderIdx[id] = 3; 
        
        track.style.transform = `translateX(-${sliderIdx[id] * width}px)`;
    };
})();
</script>
