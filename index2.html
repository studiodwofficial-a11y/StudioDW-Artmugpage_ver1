<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스탠다드 - Index 2</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap');

    /* ═══ 변수 및 기본 설정 ═══ */
    :root { 
        --point: #bada55; 
        --glow: #dcf073; 
        --bg: #0d0d0b; 
        --card: #151512; 
        --border: #2a2a26;
        --text: #e8e4de;
    }

    .dw-root * { box-sizing: border-box; margin: 0; padding: 0; }
    .dw-root {
        font-family: 'Noto Sans KR', sans-serif;
        background-color: var(--bg);
        background-image: radial-gradient(rgba(186, 218, 85, 0.08) 1px, transparent 1px);
        background-size: 24px 24px;
        color: var(--text);
        max-width: 1200px;
        margin: 0 auto;
        padding: 50px 0;
        line-height: 1.7;
        text-align: left;
    }

    /* ═══ 섹션 라벨 ═══ */
    .dw-section-lbl {
        display: flex; align-items: center; gap: 15px; padding: 0 20px; margin-bottom: 35px;
        font-family: 'DM Mono', monospace; font-size: 11px; color: var(--point); letter-spacing: 0.3em; opacity: 0.6;
        justify-content: center;
    }
    .dw-section-lbl::before { content: ''; flex: 1; height: 1px; background: var(--border); }
    .dw-section-lbl::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ═══ 스탠다드 포트폴리오 카드 ═══ */
    .dw-pkg-card { 
        background: var(--card); 
        border: 1.5px solid var(--border); 
        border-radius: 16px; 
        overflow: hidden; 
        margin: 0 5px;
    }
    
    /* [요청 반영] 기존의 양끝 정렬(Space-Between) 구조 유지 */
    .dw-pkg-top { 
        padding: 35px 30px; 
        border-bottom: 1.5px solid var(--border); 
        display: flex; 
        justify-content: space-between; /* 타이틀은 왼쪽 끝, 가격은 오른쪽 끝 유지 */
        align-items: start; 
    }
    .dw-pkg-title-area h3 { font-size: 32px; font-weight: 900; color: #fff; letter-spacing: -1.5px; }
    
    .dw-pkg-summary-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .dw-summary-pill { padding: 5px 16px; background: #1c1c20; border: 1.5px solid #2a2a30; border-radius: 50px; font-size: 12px; font-weight: 700; color: #777; }
    .dw-summary-pill.highlight { color: var(--point); border-color: rgba(186, 218, 85, 0.3); }

    .dw-pkg-price { font-family: 'DM Mono', monospace; font-size: 30px; font-weight: 500; color: var(--point); white-space: nowrap; }
    .dw-krw { font-size: 0.6em; margin-left: 4px; }

    /* ═══ 비디오 그리드 및 호버 애니메이션 ═══ */
    .dw-video-grid { 
        display: grid; 
        grid-template-columns: repeat(3, 1fr); 
        gap: 10px; 
        padding: 15px 15px; 
    }
    
    /* 유튜브 임베딩 박스 기본 설정 */
    .dw-video-grid iframe { 
        width: 100%; 
        aspect-ratio: 16/9; 
        border: 1.5px solid transparent; 
        border-radius: 15px; 
        background: #000; 
        transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease, border-color 0.3s ease; 
    }
    
    /* 마우스 포인터 호버 애니메이션 활성화 */
    .dw-video-grid iframe:hover {
        transform: translateY(-6px) scale(1.02); 
        border-color: var(--point); 
        box-shadow: 0 12px 24px rgba(186, 218, 85, 0.15); 
    }

    /* ═══ 모바일 환경 최적화 (화면 768px 이하) ═══ */
    @media (max-width: 768px) {
        .dw-root { padding: 30px 0; }
        .dw-section-lbl { padding: 0 15px; margin-bottom: 25px; }
        .dw-pkg-card { margin: 0 0px; border-radius: 20px; } 

        .dw-pkg-top { 
            flex-direction: column; 
            padding: 25px 20px; 
            gap: 15px; 
        }
        .dw-pkg-title-area h3 { font-size: 26px; }
        .dw-pkg-summary-row { margin-top: 12px; gap: 6px; }
        .dw-summary-pill { padding: 4px 12px; font-size: 11px; }

        .dw-pkg-price { 
            align-self: flex-end; 
            font-size: 24px; 
            margin-top: -10px; 
        }

        .dw-video-grid { 
            grid-template-columns: 1fr; 
            gap: 10px; 
            padding: 10px 5px; 
        }
        .dw-video-grid iframe { border-radius: 10px; }
        
        .dw-video-grid iframe:hover {
            transform: none;
            box-shadow: none;
            border-color: transparent;
        }
    }
</style>
</head>
<body>
<div class="dw-root">
    <div class="dw-section-lbl">PORTFOLIO · STANDARD</div>
    
    <div class="dw-pkg-card">
        <div class="dw-pkg-top">
            <div class="dw-pkg-title-area">
                <h3>Standard</h3>
                <div class="dw-pkg-summary-row">
                    <span class="dw-summary-pill highlight">3~5 Days</span>
                    <span class="dw-summary-pill">무컨펌</span>
                    <span class="dw-summary-pill">간단한 카메라</span>
                    <span class="dw-summary-pill">별도 연출 #0~1</span>
                </div>
            </div>
            <div class="dw-pkg-price">65,000 ~ <span class="dw-krw">KRW</span></div>
        </div>
        
        <div class="dw-video-grid">
            <iframe src="https://www.youtube.com/embed/m9jXO6A1gNc" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/AzoBxj_0Zmk" allowfullscreen></iframe>            
            <iframe src="https://www.youtube.com/embed/J1TMWjPzjc8" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/JD1RENEcRyw" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/czJKGTYNLes" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/N3fle_3q5Jw" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/BbYdVjuBLEs" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/q2tNb3cFbwk" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/aQ8aRNwzB7I" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/SSfPjWnP35E" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/XTIeLxLQXFk" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/gDm0Sf8zevs" allowfullscreen></iframe>
        </div>
    </div>
</div>
</body>
</html>
